name: Content board

# Keeps the content board in step with the work. Four jobs:
#   route         -- an issue arrives or changes: place it if it is new, finish a
#                    closed translation, restore a reopened post
#   pr            -- a draft PR opens, is approved by a maintainer, or merges:
#                    move its post's card
#   reconcile     -- every 15 minutes: act on cards a person moved, catch up on
#                    approvals and merges the event jobs missed, place stragglers
#   ensure-labels -- the intake templates only apply labels that already exist,
#                    so create any the templates declare but the repo lacks
#
# Why a schedule at all: a repository workflow cannot trigger on a card move.
# `projects_v2_item` is an org-only webhook. The reconciler is how manual moves
# are seen, so they are acted on within about 15 minutes, not instantly.
#
# Why pull_request_target: draft PRs come from forks, and a fork's
# `pull_request` run gets no secrets. pull_request_target runs this repo's own
# code from main with secrets. It never checks out or runs the PR's code; it
# reads the PR's metadata through the API and nothing else. Reviews have no
# _target variant, so a review on a fork PR is picked up by the reconciler.
#
# Board writes need a CLASSIC token with `project` scope, in a PROJECT_TOKEN
# secret. Two things make that necessary rather than a preference:
# GITHUB_TOKEN cannot write to Projects V2 at all, and a fine-grained PAT has no
# account-level Projects permission, so it cannot reach a *user-owned* board.
# Setup and the routing table are in docs/pipeline/board-routing.md.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, edited]
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/content-board.yml'
      - 'tools/board_*.py'
      - 'docs/pipeline/stage-checklists.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and log, but change nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Serialize per issue or PR, so two rapid edits cannot race to set a column.
  # Scheduled and dispatch runs share one slot. Never cancel in progress: a
  # half-applied move is worse than a slow one. A run that is queued behind
  # another and then dropped is not lost; the next reconcile catches it up.
  group: >-
    content-board-${{ github.event.issue.number ||
    github.event.pull_request.number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  # A missing PROJECT_TOKEN would make every other job fail one API call at a
  # time, which reads like a transient outage. Say so once, plainly, up front.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
        run: |
          if [ -z "$BOARD_NUMBER" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Content board routing is not active"
              echo
              echo "The \`BOARD_NUMBER\` repository variable is not set, so"
              echo "there is no board to route to. It has no default because"
              echo "project numbers are reused across accounts -- a guess would"
              echo "write cards onto someone else's board rather than fail."
              echo
              echo "Set it under Settings -> Secrets and variables -> Actions"
              echo "-> Variables. See **docs/pipeline/board-routing.md**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Board routing inactive::BOARD_NUMBER variable is not set; see docs/pipeline/board-routing.md"
          elif [ -z "$PROJECT_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Content board routing is not active"
              echo
              echo "The \`PROJECT_TOKEN\` secret is not set, so cards cannot be"
              echo "added to the board. GITHUB_TOKEN cannot write to Projects"
              echo "V2, and a fine-grained PAT has no account-level Projects"
              echo "permission, so this needs a **classic** token with the"
              echo "\`project\` scope."
              echo
              echo "Setup: **docs/pipeline/board-routing.md**."
              echo
              echo "Issues are still being filed and labelled correctly; they"
              echo "are just not reaching the board. Nothing is lost, and a"
              echo "later sweep will place every one of them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Board routing inactive::PROJECT_TOKEN is not set; see docs/pipeline/board-routing.md"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

  route:
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true' && github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Place, finish, or restore the issue's card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Defaults to this repository's owner, so a transfer needs no edit.
          BOARD_OWNER: ${{ vars.BOARD_OWNER }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
          NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          python tools/board_automation.py issue \
            --repo "$GITHUB_REPOSITORY" --number "$NUMBER" --action "$ACTION" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  pr:
    needs: preflight
    # Reviews on a fork's PR run without secrets, so only same-repo reviews are
    # handled here. The reconciler handles the rest.
    if: >-
      needs.preflight.outputs.has_token == 'true' && (
        github.event_name == 'pull_request_target' || (
          github.event_name == 'pull_request_review' &&
          github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      # Always this repository's default branch: never the PR's own code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move the post's card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_OWNER: ${{ vars.BOARD_OWNER }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python tools/board_automation.py pr \
            --repo "$GITHUB_REPOSITORY" --number "$NUMBER" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: preflight
    if: >-
      needs.preflight.outputs.has_token == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Place stragglers, then act on moves, approvals, and merges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BOARD_OWNER: ${{ vars.BOARD_OWNER }}
          BOARD_NUMBER: ${{ vars.BOARD_NUMBER }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python tools/board_router.py sweep --repo "$GITHUB_REPOSITORY" $DRY_RUN \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/board_automation.py reconcile \
            --repo "$GITHUB_REPOSITORY" $DRY_RUN \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # GitHub silently drops an issue-template label that does not exist in the
  # repo, which would leave every intake issue unlabelled and unroutable -- a
  # failure with no error message anywhere. This job makes the templates
  # self-healing: whatever they declare, the repo gets.
  ensure-labels:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create any label the templates declare but the repo lacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          declared=$(grep -h '^labels:' .github/ISSUE_TEMPLATE/*.md \
            | sed 's/^labels: *//' \
            | tr -d '[]"' \
            | tr ',' '\n' \
            | sed 's/^ *//;s/ *$//' \
            | grep -v '^$' | sort -u)
          existing=$(gh label list --limit 200 --json name -q '.[].name' | sort -u)
          missing=$(comm -23 <(echo "$declared") <(echo "$existing") || true)
          if [ -z "$missing" ]; then
            echo "All template labels exist." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Created missing template labels" >> "$GITHUB_STEP_SUMMARY"
          while read -r label; do
            [ -z "$label" ] && continue
            gh label create "$label" --color ededed \
              --description "Auto-created: declared by an issue template" || true
            echo "- \`$label\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<< "$missing"
          echo "::warning title=Labels were missing::Created: $(echo "$missing" | tr '\n' ' ')"
